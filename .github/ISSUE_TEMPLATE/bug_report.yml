name: Bug report
description: Something does not work as the documentation says.
body:
  - type: markdown
    attributes:
      value: "**Never paste a Lurk key (`lurk_sk_…`), a webhook secret or a user token.** Error responses have a `request_id`: that is all we need to find it."
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: "Node 24, Python 3.12, Cloudflare Workers, ..."
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What you did and what happened
      description: The smallest code that shows it, and the error (with its `request_id`).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
